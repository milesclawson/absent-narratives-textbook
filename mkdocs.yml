# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Absent Narratives'
site_description: 'An 18-week high school course examining how race, ethnicity, nationality, gender, and sexuality have shaped the untold and marginalized narratives of history'
site_author: 'Miles Lawson'
site_url: 'https://milesclawson.github.io/absent-narratives-textbook/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/milesclawson/absent-narratives-textbook'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Miles Lawson. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Foundations of Historical Inquiry:
          - Content: chapters/01-foundations-of-historical-inquiry/index.md
          - Quiz: chapters/01-foundations-of-historical-inquiry/quiz.md
      - 2. The Vocabulary of Power and Exclusion:
          - Content: chapters/02-vocabulary-of-power-and-exclusion/index.md
          - Quiz: chapters/02-vocabulary-of-power-and-exclusion/quiz.md
      - 3. Identity, Race, and Social Construction:
          - Content: chapters/03-identity-race-and-social-construction/index.md
          - Quiz: chapters/03-identity-race-and-social-construction/quiz.md
      - "4. Case Study: Manifest Destiny":
          - Content: chapters/04-case-study-manifest-destiny/index.md
          - Quiz: chapters/04-case-study-manifest-destiny/quiz.md
      - 5. Government Representation and Systemic Bias:
          - Content: chapters/05-government-representation-and-systemic-bias/index.md
          - Quiz: chapters/05-government-representation-and-systemic-bias/quiz.md
      - 6. Economic Exclusion:
          - Content: chapters/06-economic-exclusion/index.md
          - Quiz: chapters/06-economic-exclusion/quiz.md
      - 7. The Justice System and the Construction of Criminality:
          - Content: chapters/07-justice-system-and-criminality/index.md
          - Quiz: chapters/07-justice-system-and-criminality/quiz.md
      - 8. Representation in the Media:
          - Content: chapters/08-representation-in-the-media/index.md
          - Quiz: chapters/08-representation-in-the-media/quiz.md
      - 9. Indigenous Sovereignty and Tribal Relations:
          - Content: chapters/09-indigenous-sovereignty-and-tribal-relations/index.md
          - Quiz: chapters/09-indigenous-sovereignty-and-tribal-relations/quiz.md
      - 10. Migration, Colonialism, and Global Perspectives:
          - Content: chapters/10-migration-colonialism-and-global-perspectives/index.md
          - Quiz: chapters/10-migration-colonialism-and-global-perspectives/quiz.md
      - 11. Civil Rights and Liberation Movements:
          - Content: chapters/11-civil-rights-and-liberation-movements/index.md
          - Quiz: chapters/11-civil-rights-and-liberation-movements/quiz.md
      - 12. Religion and Cultural Diffusion:
          - Content: chapters/12-religion-and-cultural-diffusion/index.md
          - Quiz: chapters/12-religion-and-cultural-diffusion/quiz.md
      - 13. Language and Power:
          - Content: chapters/13-language-and-power/index.md
          - Quiz: chapters/13-language-and-power/quiz.md
      - 14. Research Methods and the Capstone Project:
          - Content: chapters/14-research-methods-and-capstone-project/index.md
          - Quiz: chapters/14-research-methods-and-capstone-project/quiz.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Glossary Quality Report: learning-graph/glossary-quality-report.md
      - FAQ Quality Report: learning-graph/faq-quality-report.md
      - FAQ Coverage Gaps: learning-graph/faq-coverage-gaps.md
      - Quiz Generation Report: learning-graph/quiz-generation-report.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - FAQ: faq.md
  - Glossary: glossary.md
  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md
  **/index-template.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Absent Narratives'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
